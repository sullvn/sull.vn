[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"

#
# Lints
#
# Strictness is turned all the way up.
#

[workspace.lints.rust]
# Groups need -1 priority so later, more specific rules
# can fine tune them
let_underscore = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_conversions = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
empty_structs_with_brackets = "warn"
exit = "warn"
expect_used = "warn"
if_then_some_else_none = "warn"
indexing_slicing = "warn"
missing_assert_message = "warn"
mod_module_files = "warn"
panic = "warn"
panic_in_result_fn = "warn"
print_stderr = "warn"
print_stdout = "warn"
redundant_pub_crate = "allow" # Troublesome overlap with `unreachable_pub`
redundant_type_annotations = "warn"
str_to_string = "warn"
string_slice = "warn"
todo = "warn"
try_err = "warn"
unimplemented = "warn"
unreachable = "warn"
unused_result_ok = "warn"
unwrap_used = "warn"

# Smallest wasm binaries; native release builds keep Cargo's defaults
[profile.wasm-release]
# Start from Cargo's release profile
inherits = "release"

# Optimize for size, giving up loop vectorization (little use without wasm SIMD)
opt-level = "z"

# Optimize across all crates at link time, removing unused code
lto = "fat"

# Compile each crate as one unit, so the optimizer sees all of it at once
codegen-units = 1

# Strip symbols and debug info from the binary
strip = true

# No `panic = "abort"`: wasm32-unknown-unknown already aborts on panic
