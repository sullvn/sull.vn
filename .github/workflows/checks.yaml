name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Install dependencies
        run: nix develop --no-update-lock-file -c pnpm install --frozen-lockfile

      - name: Cache processed images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.astro/assets
          key: >-
            astro-images-v1-${{ runner.os }}-${{ runner.arch }}-${{
              hashFiles('astro.config.ts', 'pnpm-lock.yaml', 'flake.lock',
                'src/**/*.png', 'src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.avif',
                'src/**/*.webp', 'src/**/*.gif', 'src/**/*.svg', 'src/**/*.tif',
                'src/**/*.tiff', 'src/**/*.heic', 'src/**/*.heif')
            }}

      - name: Run tests
        run: nix develop --no-update-lock-file -c pnpm test
