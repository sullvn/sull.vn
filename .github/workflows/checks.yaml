name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test and deploy
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1

      - name: Check Nix cache
        run: .github/scripts/check-nix-cache

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cmd-format: nix develop --no-update-lock-file -c {0}

      - name: Install packages
        run: nix develop --no-update-lock-file -c pnpm install --frozen-lockfile

      - name: Cache images
        uses: actions/cache@v6.1.0
        with:
          path: node_modules/.astro/assets
          key: >-
            astro-images-v1-${{ runner.os }}-${{ runner.arch }}-${{
              hashFiles('astro.config.ts', 'pnpm-lock.yaml', 'flake.lock',
                'src/**/*.png', 'src/**/*.jpg', 'src/**/*.jpeg', 'src/**/*.avif',
                'src/**/*.webp', 'src/**/*.gif', 'src/**/*.svg', 'src/**/*.tif',
                'src/**/*.tiff', 'src/**/*.heic', 'src/**/*.heif')
            }}

      - name: Tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop --no-update-lock-file -c pnpm test

      - name: Deploy
        id: deploy
        if: ${{ !github.event.pull_request.head.repo.fork }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          #
          # Required to be a GitHub variable, not a secret.
          #
          # GitHub drops outputs containing secrets. And the deployment URL
          # contains the project name!
          #
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
        run: |
          nix develop --no-update-lock-file -c pnpm exec wrangler pages deploy dist --project-name="$CLOUDFLARE_PROJECT_NAME" --branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          jq -r 'select(.type == "pages-deploy-detailed") | "url=\(.alias // .url)"' "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"
